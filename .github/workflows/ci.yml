name: CI pipeline

on:
  pull_request:
    branches:
      - dev

  push:
    branches:
      - dev

jobs:
  client:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

  server:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # No secrets needed: the suite is pure unit tests (deadline-sweep cutoff,
      # magic bytes, password hashing, reset tokens, JWT secret strength) plus
      # Hono `app.request()` checks that return before any DB access. The only
      # env they touch is a dummy JWT_SECRET defined inline in the test file, so
      # DATABASE_URL is deliberately absent — if a future test needs the real DB,
      # add a dedicated test database rather than pointing CI at the shared Neon one.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test