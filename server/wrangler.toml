name = "kabsupanion-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# Secrets (DATABASE_URL, JWT_SECRET) are NOT set here.
# Local:      put them in .dev.vars
# Production: run `wrangler secret put DATABASE_URL`

[triggers]
# Sweep every 15 minutes: delete tasks whose due date's calendar day (Asia/Manila,
# UTC+8) has fully elapsed. Cron can't fire exactly at 11:59 PM, so worst case a
# task is removed ~15 min after end-of-day.
crons = ["*/15 * * * *"]

# --- Auth rate limiting (Workers Rate Limiting binding) ---
# `period` may only be 10 or 60 (seconds). Limits are per distinct key. Generous
# per-IP budgets accommodate shared campus NAT; the strict per-email budget is the
# real brute-force guard for a single account. Tune the numbers here as needed.
[[ratelimits]]
name = "AUTH_IP_LIMIT"          # keyed per client IP on POST /auth/login
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "AUTH_EMAIL_LIMIT"       # keyed per target email on POST /auth/login
namespace_id = "1002"
simple = { limit = 6, period = 60 }

[[ratelimits]]
name = "REGISTER_IP_LIMIT"      # keyed per client IP on POST /auth/register
namespace_id = "1003"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "PASSWORD_RESET_LIMIT"   # keyed per client IP on POST /auth/reset-password
namespace_id = "1004"
simple = { limit = 5, period = 60 }

[vars]
# Non-secret. Frontend base URL used to build the admin-generated password-reset
# link (`${APP_URL}/reset-password?token=...`). Override per environment as needed.
APP_URL = "https://kabsupanion.vercel.app"
